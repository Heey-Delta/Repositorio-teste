<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Função zeta de Riemann</title>
<style>
  /* color-scheme igual ao do <iframe> da página (light): o fundo do iframe fica transparente e pega o fundo da página */
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Desenho animado da função zeta de Riemann sobre a linha crítica"></canvas>
<script>
/* Função zeta de Riemann, desenhada conforme a rolagem da página.
   Traça a curva t ↦ ζ(1/2 + it) no plano complexo (a "linha crítica"): ela sai de ζ(1/2) ≈ −1,46 e dá voltas, passando
   perto da origem a cada zero não trivial (t ≈ 14,13; 21,02; 25,01; 30,42; 32,94; 37,59; 40,92; 43,33; 48,01; 49,77).
   Cálculo: soma de Euler–Maclaurin (precisa para |t| até ~60).
   A página manda {type:'zeta:progress', value: 0..1} (quanto da curva já foi desenhado). Sem a página (aberto sozinho),
   o desenho se repete sozinho. Cor: um tom um pouco mais claro que o fundo do card (TONE). */
(function () {
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var TONE = [46, 46, 46];   // fundo do card (#121212) + ~10% de branco
  var target = 0, shown = -1, standalone = true;
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || d.type !== 'zeta:progress') return;
    standalone = false; target = Math.max(0, Math.min(1, +d.value || 0));
  });
  try { if (parent !== window) parent.postMessage({ type: 'zeta:ready' }, '*'); } catch (e) {}

  // ---- números complexos [re, im] ----
  function mul(a, b) { return [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]]; }
  function div(a, b) { var d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; }
  function powNeg(n, s) { var l = Math.log(n), r = Math.exp(-s[0] * l), a = -s[1] * l; return [r * Math.cos(a), r * Math.sin(a)]; }   // n^(-s)
  var C = [1 / 12, -1 / 720, 1 / 30240, -1 / 1209600, 1 / 47900160, -691 / (2730 * 479001600)];   // B(2k)/(2k)!
  function zeta(s) {
    var N = 24, sum = [0, 0], n, k;
    for (n = 1; n < N; n++) { var p = powNeg(n, s); sum[0] += p[0]; sum[1] += p[1]; }
    var Ns = powNeg(N, s);
    var t1 = div(mul(Ns, [N, 0]), [s[0] - 1, s[1]]);   // N^(1-s)/(s-1)
    sum[0] += t1[0] + Ns[0] / 2; sum[1] += t1[1] + Ns[1] / 2;
    var poly = [s[0], s[1]], NN = [N, 0], term;
    for (k = 1; k <= C.length; k++) {
      // s(s+1)...(s+2k-2) · N^(-s-2k+1)
      if (k > 1) { poly = mul(poly, [s[0] + 2 * k - 3, s[1]]); poly = mul(poly, [s[0] + 2 * k - 2, s[1]]); }
      var scale = C[k - 1] * Math.pow(N, -(2 * k - 1));
      term = mul(poly, Ns); sum[0] += term[0] * scale; sum[1] += term[1] * scale;
    }
    return sum;
  }

  // ---- pontos da curva ----
  var T_MAX = 50, STEPS = 2600, pts = [], i, minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (i = 0; i <= STEPS; i++) {
    var z = zeta([0.5, (i / STEPS) * T_MAX]); pts.push(z);
    if (z[0] < minX) minX = z[0]; if (z[0] > maxX) maxX = z[0]; if (z[1] < minY) minY = z[1]; if (z[1] > maxY) maxY = z[1];
  }
  var cx0 = (minX + maxX) / 2, cy0 = (minY + maxY) / 2, span = Math.max(maxX - minX, maxY - minY);

  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  }
  resize(); window.addEventListener('resize', resize);
  function toScreen(z) { var k = Math.min(W, H) * 0.86 / span; return [W / 2 + (z[0] - cx0) * k, H / 2 - (z[1] - cy0) * k]; }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rgba(a) { return 'rgba(' + TONE[0] + ',' + TONE[1] + ',' + TONE[2] + ',' + a + ')'; }

  var cur = 0, t0 = performance.now(), lastW = -1, lastH = -1;
  function frame(now) {
    if (standalone) { var cyc = (Math.max(0, now - t0) % 20000) / 16000; target = Math.min(1, cyc); }   // sozinho: 16 s desenhando e uma pausa
    cur += (target - cur) * (reduce ? 1 : 0.14);
    if (Math.abs(target - cur) < 0.0004) cur = target;
    if (cur === shown && W === lastW && H === lastH) { requestAnimationFrame(frame); return; }
    shown = cur; lastW = W; lastH = H;
    draw(cur);
    requestAnimationFrame(frame);
  }
  function draw(progress) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    // eixos (plano complexo) e o ponto ζ = 0
    var o = toScreen([0, 0]);
    ctx.strokeStyle = rgba(0.55); ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(0, o[1]); ctx.lineTo(W, o[1]); ctx.moveTo(o[0], 0); ctx.lineTo(o[0], H); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(o[0], o[1], 3, 0, 6.2832); ctx.fillStyle = rgba(1); ctx.fill();
    // curva até o ponto atual
    var last = Math.floor(progress * STEPS), j, p, q;
    if (last > 0) {
      ctx.beginPath(); p = toScreen(pts[0]); ctx.moveTo(p[0], p[1]);
      for (j = 1; j <= last; j++) { q = toScreen(pts[j]); ctx.lineTo(q[0], q[1]); }
      ctx.strokeStyle = rgba(1); ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    }
    // ponta da caneta
    var h = toScreen(pts[last]);
    ctx.fillStyle = rgba(1); ctx.beginPath(); ctx.arc(h[0], h[1], 3, 0, 6.2832); ctx.fill();
    // legenda: ζ(½ + it) e o valor de t
    ctx.font = '11px ui-monospace, Menlo, Consolas, monospace'; ctx.fillStyle = rgba(1); ctx.textAlign = 'center';
    ctx.fillText('ζ(½ + it)   t = ' + (progress * T_MAX).toFixed(1), W / 2, H - 6);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
