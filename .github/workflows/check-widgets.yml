name: Build e widgets obrigatórios

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Astro + Tailwind)
        run: npm run build
      - name: Verificar widgets obrigatórios nos projetos
        run: scripts/check-widgets.sh
